# ─────────────────────────────────────────────────────────
# PostgreSQL 数据库配置
# ─────────────────────────────────────────────────────────
#
# 使用方式:
#   1. 在 docker-compose.yml 中启用 postgres 服务
#   2. 设置连接字符串（二选一）:
#      a. 在此文件的 dsn 字段填写
#      b. 设置环境变量 DATABASE_URL（优先级更高）
#
# 不配置 = 不使用 PG，回退 JSONL 文件存储
# ─────────────────────────────────────────────────────────

database:
  # 连接字符串
  # 格式: postgresql://user:password@host:port/dbname
  # Docker 内: postgresql://jdagent:devpassword@postgres:5432/jdagent
  # 本地开发: postgresql://jdagent:devpassword@localhost:5432/jdagent
  dsn: null

  # 连接池：最小/最大连接数
  pool_min_size: 1
  pool_max_size: 10

  # 连接超时（秒）
  connect_timeout: 10.0
